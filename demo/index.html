<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>puml-canvas-js demo</title>
    <style>
      :root {
        --sidebar-width: 220px;
        --border: #d4d4d4;
        --muted: #666;
        --hover: #eef3ff;
        --active: #d6e4ff;
        --card-bg: #fafafa;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        grid-template-columns: var(--sidebar-width) 1fr;
        grid-template-rows: auto 1fr;
        gap: .75rem;
        padding: .75rem;
        height: 100vh;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
      }
      h1 { margin: 0 0 .15rem; font-size: 1.05rem; }
      header p { margin: 0; color: var(--muted); font-size: .8rem; }

      /* Sidebar — just kind buttons */
      #kinds-sidebar {
        grid-row: 2 / 3;
        grid-column: 1 / 2;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fafafa;
        overflow-y: auto;
        padding: .35rem;
        display: flex;
        flex-direction: column;
        gap: .2rem;
      }
      .kind-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .35rem;
        width: 100%;
        padding: .4rem .6rem;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 4px;
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        color: #222;
      }
      .kind-btn:hover { background: var(--hover); }
      .kind-btn.active { background: var(--active); border-color: #7aa7ff; font-weight: 600; }
      .kind-btn-count {
        color: var(--muted);
        font-weight: 400;
        font-size: 11px;
        background: #f0f0f0;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 .35rem;
        min-width: 1.6rem;
        text-align: center;
      }
      .kind-btn.active .kind-btn-count { background: #fff; }

      /* Gallery */
      #gallery {
        grid-row: 2 / 3;
        grid-column: 2 / 3;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
        overflow-y: auto;
        padding: .75rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .gallery-card {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card-bg);
        overflow: hidden;
        flex: 0 0 auto;
      }
      .gallery-card-title {
        padding: .5rem .75rem;
        font-size: 13px;
        font-weight: 600;
        background: #eaeaea;
        border-bottom: 1px solid var(--border);
      }
      .gallery-card-body {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        align-items: stretch;
        gap: .5rem;
        padding: .5rem;
      }
      .gallery-column {
        display: flex;
        flex-direction: column;
        gap: .3rem;
        min-width: 0;
      }
      .gallery-column-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .03em;
      }
      .gallery-column > .gallery-preview,
      .gallery-column > .gallery-original {
        flex: 1 1 auto;
      }
      .gallery-source {
        width: 100%;
        height: 100%;
        min-height: 8rem;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        padding: .5rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        resize: both;
        max-width: none;
        background: #fff;
        white-space: pre;
        overflow: auto;
        caret-color: #1a5fff;
      }
      .gallery-source:focus {
        outline: 2px solid #7aa7ff;
        outline-offset: -1px;
        border-color: #7aa7ff;
        background: #fff;
      }
      .gallery-preview {
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
        padding: .5rem;
        height: auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gallery-preview svg { display: block; max-width: 100%; }
      .gallery-preview .placeholder {
        color: var(--muted);
        font-size: 12px;
      }
      .gallery-preview pre {
        margin: 0;
        color: crimson;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        text-align: left;
        width: 100%;
      }

      /* Reference rendering from the official PlantUML server (plantuml.com) */
      .gallery-original {
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
        padding: .5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gallery-original img { display: block; max-width: 100%; height: auto; }
      .gallery-original .placeholder {
        color: var(--muted);
        font-size: 12px;
      }
      .gallery-original pre {
        margin: 0;
        color: crimson;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        text-align: left;
        width: 100%;
      }

      @media (max-width: 900px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto 1fr;
        }
        #kinds-sidebar { grid-row: 2 / 3; grid-column: 1 / -1; max-height: 160px; flex-direction: row; flex-wrap: wrap; }
        .kind-btn { width: auto; }
        #gallery { grid-row: 3 / 4; grid-column: 1 / -1; }
        .gallery-card-body { grid-template-columns: 1fr; }
      }
      @media (min-width: 901px) and (max-width: 1300px) {
        .gallery-card-body { grid-template-columns: 1fr 1fr; }
        .gallery-source { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>puml-canvas-js</h1>
        <p>Pipeline: source → lexer → parser → AST → layout → scene → renderer (SVG)</p>
      </div>
    </header>
    <aside id="kinds-sidebar" aria-label="Diagram kinds"></aside>
    <main id="gallery" aria-label="Examples gallery"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
