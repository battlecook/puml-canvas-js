<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>puml-canvas-js demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 1rem; height: 100vh; box-sizing: border-box; }
      header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
      h1 { margin: 0 0 .25rem; font-size: 1.1rem; }
      p { margin: 0; color: #666; font-size: .85rem; }
      textarea { width: 100%; height: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding: .75rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: none; }
      #output { border: 1px solid #ccc; border-radius: 4px; padding: .75rem; background: #fff; overflow: auto; }
      #output svg { display: block; max-width: 100%; }
      button, .file-pick { font-family: inherit; font-size: .85rem; padding: .25rem .6rem; border: 1px solid #ccc; background: #fafafa; border-radius: 4px; cursor: pointer; display: inline-block; }
      button:hover, .file-pick:hover { background: #efefef; }
      .controls { display: flex; gap: .35rem; flex-wrap: wrap; }
      pre { margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>puml-canvas-js</h1>
        <p>Pipeline: source → lexer → parser → AST → layout → scene → renderer (SVG)</p>
      </div>
      <div class="controls">
        <label class="file-pick">
          Open file…
          <input id="file" type="file" accept=".puml,.plantuml,.uml,.iuml,.wsd,.txt,text/plain" hidden />
        </label>
        <button data-sample="sequence">Sequence</button>
        <button data-sample="class">Class</button>
        <button data-sample="activity">Activity</button>
        <button data-sample="usecase">Use case</button>
        <button data-sample="state">State</button>
        <button data-sample="component">Component</button>
        <button data-sample="deployment">Deployment</button>
        <button data-sample="object">Object</button>
        <button data-sample="mindmap">Mindmap</button>
        <button data-sample="wbs">WBS</button>
        <button data-sample="gantt">Gantt</button>
        <button data-sample="json">JSON</button>
        <button data-sample="ebnf">EBNF</button>
        <button data-sample="regex">Regex</button>
      </div>
    </header>
    <textarea id="src" spellcheck="false"></textarea>
    <div id="output"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
